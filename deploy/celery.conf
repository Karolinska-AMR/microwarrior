# EnvironmentFile for celery.service (installed as /etc/conf.d/celery)

# Name of the Celery worker node
CELERYD_NODES="worker1"

# conda installation and environment used by deploy/run_celery.sh
CONDA_ROOT="/home/<USER>/miniconda3"
CONDA_ENV="microwarrior"

# Path to the Celery binary in the microwarrior conda environment
CELERY_BIN="/home/<USER>/miniconda3/envs/microwarrior/bin/celery"

# Celery application name
CELERY_APP="microwarrior"

# Extra command-line arguments for the worker.
# concurrency=1: one spear-mtb run at a time, the pipeline itself is parallel
CELERYD_OPTS="-E --concurrency=1"

# PID and log file locations (%n = node name, %I = child process index)
CELERYD_PID_FILE="/var/run/celery/%n.pid"
CELERYD_LOG_FILE="/var/log/celery/%n%I.log"

CELERYD_LOG_LEVEL="INFO"
