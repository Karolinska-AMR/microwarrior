{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Page</title>
    <!-- Include Bootstrap CSS -->
     <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.png' %}">
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Montserrat|Poppins"
    />
    <link rel="stylesheet" href="{% static "css/fw.all.min.css" %}"/>
    <link rel="stylesheet" href="{% static "css/bootstrap.min.css" %}"/>
    <link rel="stylesheet" href="{% static "css/auth.css" %}"/>
</head>
<body>
<nav class="navbar navbar-expand-md fixed-top">
    <div class="container-fluid">
        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarCollapse"
                aria-controls="navbarCollapse"
                aria-expanded="false"
                aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="{% url 'dashboard' %}"><i
                            class="fas fa-tachometer-alt fa-lg"></i> Dashboard</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4 mb-4 p-3 d-flex justify-content-center ">
    <div class="card mp-4">
        <div class="my-4 d-flex justify-content-center">
            <img src="{% static "img/checkmark.png" %}"
                 class="w-25" alt="Image"/>
        </div>

        <div class="card-body d-flex flex-column justify-content-center px-1">
            <h5 class="card-text text-center">Password has changed successfully!</h5>
            <p class="card-text text-center">Take me to <a href="{% url "dashboard" %}"> Dashboard</a></p>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"
></script>
</body>
</html>
