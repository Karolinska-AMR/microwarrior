{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login Page</title>
    <!-- Include Bootstrap CSS -->
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Montserrat|Poppins"
    />
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
            crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static "css/auth.css" %}"/>
</head>
<body>
<nav class="navbar navbar-expand-md fixed-top">
    <div class="container-fluid">

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarCollapse"
                aria-controls="navbarCollapse"
                aria-expanded="false"
                aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="{% url 'dashboard' %}"><i
                            class="fas fa-tachometer-alt fa-lg"></i> Dashboard</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="card shadow-sm">
    <img src="{% static "img/ch_pass.jpeg" %}" class="card-img-top" alt="Image"/>
    <div class="card-body">
        <div class="card-title text-center">

            <h4 class="mb-3">Change Password</h4>

            {% if messages %}
                <hr>
                <ul class="list-unstyled ">

                    {% for message in messages %}
                        <li class="text-danger"> {{ message }} </li>
                    {% endfor %}
                </ul>
            {% endif %}

            {% block content %}
            {% endblock %}
        </div>

        <form method="post">
            {% csrf_token %}
            <div id="chpass-form">
                {{ form.as_p }}
            </div>
            <div class="form-group mt-3">
                <button type="submit" class="btn btn-primary w-100">Change</button>
            </div>
        </form>
    </div>
</div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"
></script>
</body>
</html>
